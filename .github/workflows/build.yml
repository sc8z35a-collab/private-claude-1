name: Build and validate GeoGuard JP
on:
  push:
    paths:
      - 'chunks/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'chunks/**'
      - '.github/workflows/build.yml'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator'
      - name: Reconstruct source
        run: |
          set -euo pipefail
          cat chunks/part* | base64 --decode > geoguard-source.tar.xz
          mkdir src
          tar -xJf geoguard-source.tar.xz -C src
          chmod +x src/scripts/static_audit.py
          test -f src/app/src/main/AndroidManifest.xml
          sed -i 's/BuildConfig.VERSION_NAME/"1.0.0"/' src/app/src/main/java/jp/gumi/geoguard/MainActivity.java
      - name: Static policy audit
        working-directory: src
        run: python3 scripts/static_audit.py | tee static-audit.txt
      - name: Unit tests, lint and release build
        working-directory: src
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace clean test lintRelease assembleRelease 2>&1 | tee gradle-build.log
      - name: Create compatibility APK and audit
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p build-artifacts
          cp src/app/build/outputs/apk/release/app-release-unsigned.apk build-artifacts/unsigned.apk
          keytool -genkeypair -noprompt -keystore test-release.jks -storepass changeit -keypass changeit -alias geoguardtest -keyalg RSA -keysize 3072 -sigalg SHA256withRSA -validity 3650 -dname 'CN=GeoGuard CI Test, OU=CI, O=GUMI, C=JP'
          cp build-artifacts/unsigned.apk build-artifacts/test-signed-unaligned.apk
          jarsigner -keystore test-release.jks -storepass changeit -keypass changeit -sigalg SHA256withRSA -digestalg SHA-256 build-artifacts/test-signed-unaligned.apk geoguardtest
          "$BT/zipalign" -f -p 4 build-artifacts/test-signed-unaligned.apk build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk
          jarsigner -verify -verbose -certs build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk > build-artifacts/jarsigner-verify.txt
          "$BT/apksigner" verify --verbose --print-certs build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk > build-artifacts/apksigner-verify.txt
          "$BT/aapt" dump badging build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk > build-artifacts/aapt-badging.txt
          "$BT/aapt" dump permissions build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk > build-artifacts/aapt-permissions.txt
          "$BT/zipalign" -c -p 4 build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk > build-artifacts/zipalign-verify.txt
          unzip -t build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk > build-artifacts/zip-integrity.txt
          sha256sum build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk > build-artifacts/SHA256SUMS.txt
          cp src/static-audit.txt src/gradle-build.log build-artifacts/
          cp geoguard-source.tar.xz build-artifacts/
          grep -q 'Verified using v1 scheme (JAR signing): true' build-artifacts/apksigner-verify.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): false' build-artifacts/apksigner-verify.txt
          grep -q "targetSdkVersion:'28'" build-artifacts/aapt-badging.txt
          grep -q "sdkVersion:'26'" build-artifacts/aapt-badging.txt
          grep -q 'No errors detected' build-artifacts/zip-integrity.txt
      - name: Enable emulator hardware acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Android 16 API 36 install and cold-start validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            APK=build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk
            adb install -r "$APK" | tee build-artifacts/api36-install.txt
            grep -q 'Success' build-artifacts/api36-install.txt
            adb shell pm clear jp.gumi.geoguard >/dev/null || true
            adb logcat -c
            adb shell am force-stop jp.gumi.geoguard
            adb shell am start -W -n jp.gumi.geoguard/.MainActivity | tee build-artifacts/api36-start.txt
            sleep 5
            adb shell pidof jp.gumi.geoguard | tee build-artifacts/api36-pid-after-5s.txt
            test -s build-artifacts/api36-pid-after-5s.txt
            adb logcat -d -v threadtime > build-artifacts/api36-logcat.txt
            grep -E 'ActivityTaskManager.*Displayed.*jp\.gumi\.geoguard/.MainActivity' build-artifacts/api36-logcat.txt | tee build-artifacts/api36-displayed.txt
            test -s build-artifacts/api36-displayed.txt
            if grep -E 'FATAL EXCEPTION|Process: jp\.gumi\.geoguard' build-artifacts/api36-logcat.txt; then
              exit 1
            fi
      - name: Android 10 API 29 cold-start and rendered-screen validation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            APK=build-artifacts/GeoGuard-JP-v1.0.0-POCOF7-Compat.apk
            adb install -r "$APK" | tee build-artifacts/api29-install.txt
            grep -q 'Success' build-artifacts/api29-install.txt
            adb shell pm clear jp.gumi.geoguard >/dev/null || true
            adb logcat -c
            adb shell am force-stop jp.gumi.geoguard
            adb shell am start -W -n jp.gumi.geoguard/.MainActivity | tee build-artifacts/api29-start.txt
            grep -q 'Status: ok' build-artifacts/api29-start.txt
            sleep 5
            adb shell pidof jp.gumi.geoguard | tee build-artifacts/api29-pid-after-5s.txt
            test -s build-artifacts/api29-pid-after-5s.txt
            adb exec-out screencap -p > build-artifacts/api29-screen.png
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml build-artifacts/api29-window.xml >/dev/null
            grep -q 'GeoGuard' build-artifacts/api29-window.xml
            python3 - <<'PY'
            import struct, zlib
            p='build-artifacts/api29-screen.png'
            data=open(p,'rb').read()
            assert data[:8] == b'\x89PNG\r\n\x1a\n' and len(data) > 10000
            pos=8; chunks=[]; w=h=ct=bd=None
            while pos < len(data):
                n=struct.unpack('>I',data[pos:pos+4])[0]; typ=data[pos+4:pos+8]; body=data[pos+8:pos+8+n]; pos += 12+n
                if typ == b'IHDR': w,h,bd,ct,_,_,_=struct.unpack('>IIBBBBB',body)
                elif typ == b'IDAT': chunks.append(body)
                elif typ == b'IEND': break
            assert bd == 8 and ct in (2,6)
            bpp={2:3,6:4}[ct]; stride=w*bpp; raw=zlib.decompress(b''.join(chunks)); rows=[]; prev=bytearray(stride); off=0
            for _ in range(h):
                f=raw[off]; off+=1; cur=bytearray(raw[off:off+stride]); off+=stride
                for i in range(stride):
                    a=cur[i-bpp] if i>=bpp else 0; b=prev[i]; c=prev[i-bpp] if i>=bpp else 0
                    if f==1: cur[i]=(cur[i]+a)&255
                    elif f==2: cur[i]=(cur[i]+b)&255
                    elif f==3: cur[i]=(cur[i]+((a+b)//2))&255
                    elif f==4:
                        q=a+b-c; pa=abs(q-a); pb=abs(q-b); pc=abs(q-c); pr=a if pa<=pb and pa<=pc else (b if pb<=pc else c)
                        cur[i]=(cur[i]+pr)&255
                    elif f!=0: raise AssertionError(f'filter {f}')
                rows.append(cur); prev=cur
            pixels=[]
            for y in range(0,h,max(1,h//40)):
                row=rows[y]
                for x in range(0,w,max(1,w//40)):
                    i=x*bpp; pixels.append(tuple(row[i:i+3]))
            lum=[(299*r+587*g+114*b)//1000 for r,g,b in pixels]
            assert len(set(pixels)) >= 12, 'screen is effectively uniform'
            assert max(lum)-min(lum) >= 35, 'insufficient rendered contrast'
            open('build-artifacts/api29-screen-analysis.txt','w').write(f'PASS width={w} height={h} sampled_colors={len(set(pixels))} luminance_range={max(lum)-min(lum)}\n')
            PY
            adb logcat -d -v threadtime > build-artifacts/api29-logcat.txt
            if grep -E 'FATAL EXCEPTION|Process: jp\.gumi\.geoguard' build-artifacts/api29-logcat.txt; then
              exit 1
            fi
      - name: Assemble validation report
        if: always()
        run: |
          mkdir -p build-artifacts
          {
            echo 'GeoGuard JP v1.0.0 validation'
            echo
            echo 'Build: Gradle test/lint/release build completed when this file is produced.'
            echo 'Signature: see apksigner-verify.txt and jarsigner-verify.txt.'
            echo 'ZIP: see zip-integrity.txt and zipalign-verify.txt.'
            echo 'Android 16/API 36: see api36-install.txt, api36-start.txt, api36-displayed.txt, api36-pid-after-5s.txt, api36-logcat.txt.'
            echo 'Android 10/API 29: see api29-install.txt, api29-start.txt, api29-pid-after-5s.txt, api29-screen.png, api29-screen-analysis.txt, api29-logcat.txt.'
          } > build-artifacts/VALIDATION-RESULTS.txt
      - name: Upload validated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GeoGuard-JP-build
          path: build-artifacts/
          if-no-files-found: error
          retention-days: 7
